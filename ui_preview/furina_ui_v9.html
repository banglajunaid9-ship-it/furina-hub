<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Furina UI v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Clean pass: one surface colour, grouped rows with hairlines, one accent, gold only for the title and section labels. */
:root{
  --bg:#0b1530; --bg2:#0f1c3d; --rail:#09122a; --panel:rgba(255,255,255,.035); --panel2:#14224a;
  --line:rgba(255,255,255,.07); --text:#e9f0fc; --mute:#7f90b5; --hydro:#4aa3ff; --aqua:#8fdcff;
  --gold:#d8b878; --track:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.45); --solid:1;
  --flow:cubic-bezier(.25,.8,.25,1); --soft:cubic-bezier(.45,0,.2,1); --pop:cubic-bezier(.34,1.4,.64,1);
}
:root[data-theme="pneuma"]{
  --bg:#eef3fb; --bg2:#f8fafe; --rail:#e6edf8; --panel:#ffffff; --panel2:#ffffff;
  --line:rgba(20,40,90,.08); --text:#16244a; --mute:#6a7a9c; --gold:#a8822f; --track:rgba(20,40,90,.1); --shadow:rgba(30,50,100,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(900px 600px at 50% 30%,#14306a,#070f26 62%,#030713);font-family:Outfit,system-ui,sans-serif;color:var(--text);overflow:hidden;user-select:none}
.top{position:fixed;left:14px;right:14px;top:12px;display:flex;gap:8px;align-items:center;z-index:60;font-size:12px;color:#7f90b5}
.top b{color:#d8b878;font-weight:500}
.top button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#e9f0fc;font:500 12px Outfit;padding:6px 11px;border-radius:8px;cursor:pointer;transition:transform .12s}
.top button:active{transform:scale(.94)}
.top button:first-of-type{margin-left:auto}
@media (max-width:640px){.top span{display:none}}

/* ---------------- intro ---------------- */
.intro{position:fixed;inset:0;z-index:50;pointer-events:none;transition:opacity .7s var(--soft)}
.intro.done{opacity:0}
.idrop{position:absolute;left:50%;top:44%;width:14px;height:19px;margin:-19px 0 0 -7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 35%,#fff 0 12%,#8fdcff 40%,#3b86e8);box-shadow:0 0 18px rgba(143,220,255,.8);
  transform:translateY(-50vh);animation:fall .6s cubic-bezier(.55,0,1,.45) .1s forwards,vanish .15s .7s forwards}
@keyframes fall{to{transform:none}}
@keyframes vanish{to{scale:0;opacity:0}}
.irings{position:absolute;left:50%;top:44%;width:0;height:0;transform:scaleY(.28)}
.irings i{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(143,220,255,.85);opacity:0;animation:iring 1.6s var(--flow) forwards}
.irings i:nth-child(1){animation-delay:.7s}.irings i:nth-child(2){animation-delay:.86s;border-color:rgba(216,184,120,.8)}.irings i:nth-child(3){animation-delay:1.02s}
@keyframes iring{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(17)}}
.iline{position:absolute;left:50%;top:44%;height:1px;width:0;translate:-50% 0;background:linear-gradient(90deg,transparent,rgba(143,220,255,.55),transparent);animation:iline 1.4s var(--flow) .7s forwards}
@keyframes iline{to{width:70vw}}
.ilogo{position:absolute;left:0;right:0;top:calc(44% - 62px);text-align:center}
.ilogo h1{font:700 clamp(34px,11vw,50px)/62px Cinzel,serif;letter-spacing:.22em;padding-left:.22em;background:linear-gradient(180deg,#fff,#cfe9ff 55%,#d8b878);-webkit-background-clip:text;color:transparent;
  opacity:0;animation:emerge 1s var(--flow) .9s forwards}
.ilogo h1.refl{transform:scaleY(-1);filter:url(#ripple);-webkit-mask:linear-gradient(0deg,rgba(0,0,0,.45),transparent 75%);mask:linear-gradient(0deg,rgba(0,0,0,.45),transparent 75%);animation:emergeR 1s var(--flow) .9s forwards}
@keyframes emerge{from{opacity:0;transform:translateY(26px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes emergeR{from{opacity:0;transform:scaleY(-1) translateY(26px)}to{opacity:1;transform:scaleY(-1)}}
.ilogo p{margin-top:2px;font:500 11px Outfit;letter-spacing:.6em;color:#d8b878;opacity:0;animation:emerge .8s var(--flow) 1.3s forwards}

/* ---------------- stage ---------------- */
.stage{position:fixed;inset:46px 0 0 0;display:grid;place-items:center}
body.sim .stage{inset:46px 0 0 0}
.device{position:relative}
.wob{position:relative;will-change:transform}
.wob.boing{animation:boing .6s var(--soft)}
@keyframes boing{0%{transform:scale(1.025,.975)}35%{transform:scale(.99,1.012)}65%{transform:scale(1.004,.997)}100%{transform:none}}

/* ---------------- window ---------------- */
.win{position:relative;width:540px;height:400px;border-radius:16px;overflow:hidden;
  border:1px solid color-mix(in srgb,var(--gold) 30%,transparent);box-shadow:0 30px 70px -24px rgba(0,0,0,.75),0 0 0 1px rgba(0,0,0,.25);
  opacity:0;transform:translateY(46px) scale(.97);filter:blur(10px);transition:transform 1.1s var(--flow),opacity .8s var(--soft),filter .9s var(--soft)}
.win.open{opacity:1;transform:none;filter:blur(0)}
.win.min{opacity:0;transform:translateY(40px) scale(.9);filter:blur(8px);pointer-events:none;transition:transform .32s var(--soft),opacity .26s,filter .26s}
.win.fast{transition:transform .4s var(--pop),opacity .22s,filter .25s}
.inner{position:relative;width:100%;height:100%;display:grid;grid-template-columns:54px 1fr}
.bgl{position:absolute;inset:0;background:radial-gradient(420px 220px at 18% 0%,color-mix(in srgb,var(--hydro) 13%,transparent),transparent 70%),linear-gradient(170deg,var(--bg2),var(--bg));
  opacity:var(--solid);transition:opacity .2s}
.win::after{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 60%,transparent),transparent);pointer-events:none}

.logo{width:30px;height:34px;cursor:pointer;flex:none;transition:transform .22s var(--pop)}
.logo svg{width:100%;height:100%;filter:drop-shadow(0 3px 6px rgba(74,163,255,.35))}
.logo:hover{transform:scale(1.08) rotate(-6deg)}
.logo:active{transform:scale(.9)}
.say{position:absolute;left:44px;top:-36px;z-index:10;padding:5px 11px;border-radius:12px 12px 12px 4px;white-space:nowrap;
  font:500 12px Outfit;color:#16244a;background:#fff;box-shadow:0 8px 20px -6px rgba(0,0,0,.45);
  opacity:0;transform:translateY(6px) scale(.7);transform-origin:0 100%;transition:opacity .2s,transform .3s var(--pop);pointer-events:none}
.say.on{opacity:1;transform:none}

/* ---------------- rail ---------------- */
.rail{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:12px 0 10px;gap:10px;background:color-mix(in srgb,var(--rail) calc(var(--solid)*100%),transparent);border-right:1px solid var(--line)}
.tabs{position:relative;display:flex;flex-direction:column;gap:2px}
.ind{position:absolute;left:0;right:0;border-radius:9px;background:color-mix(in srgb,var(--hydro) 18%,transparent)}
.ind::before{content:"";position:absolute;left:-10px;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:0 3px 3px 0;background:var(--hydro)}
.tab{position:relative;width:34px;height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--mute);transition:color .15s}
.tab svg{width:16px;height:16px;transition:transform .2s var(--pop)}
.tab:hover{color:var(--text)}
.tab:active svg{transform:scale(.85)}
.tab.on{color:var(--text)}
.tab.on svg{color:var(--aqua)}
.tab.jump svg{animation:tabJump .3s var(--pop)}
@keyframes tabJump{40%{transform:translateY(-2px) scale(1.12,.94)}}
.tab.sep{margin-top:8px}
.tip{position:absolute;left:44px;top:50%;translate:0 -50%;white-space:nowrap;pointer-events:none;z-index:9;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font:500 11.5px Outfit;padding:4px 9px;border-radius:7px;box-shadow:0 8px 20px -6px var(--shadow);opacity:0;transform:translateX(-4px);transition:.16s var(--flow)}
.tab:hover .tip{opacity:1;transform:none}

/* ---------------- main ---------------- */
.main{position:relative;z-index:2;display:grid;grid-template-rows:52px 1fr;min-width:0}
.head{display:flex;align-items:center;gap:4px;padding:0 10px 0 16px;border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.head:active{cursor:grabbing}
.act{line-height:1;min-width:0;margin-right:auto}
.act small{display:block;font:600 9px Outfit;letter-spacing:.24em;color:var(--gold)}
.act b{display:block;margin-top:5px;font:700 16px Cinzel,serif;letter-spacing:.04em;white-space:nowrap}
.act b.swap{animation:surf .3s var(--flow)}
.sbox{display:flex;align-items:center;height:30px;border-radius:9px;width:30px;overflow:hidden;transition:width .28s var(--flow),background .2s}
.sbox:hover{background:var(--track)}
.sbox.open{width:160px;background:var(--track)}
.sbox svg{flex:none;width:30px;height:14px;color:var(--mute);cursor:pointer}
.sbox input{width:118px;background:none;border:0;outline:0;color:var(--text);font:400 12.5px Outfit}
.ib{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--mute);transition:background .15s,color .15s,transform .15s var(--pop)}
.ib svg{width:14px;height:14px;transition:transform .22s var(--pop)}
.ib:hover{background:var(--track);color:var(--text)}
.ib:active{transform:scale(.88)}
.ib.x:hover{color:#ff8796;background:rgba(255,110,130,.12)}
.ib.x:hover svg{transform:rotate(90deg)}
.ib .sun{display:none}
:root[data-theme="pneuma"] .ib .sun{display:block}
:root[data-theme="pneuma"] .ib .moon{display:none}
.ib.spin svg{animation:spinOnce .4s var(--pop)}
@keyframes spinOnce{from{transform:rotate(-120deg) scale(.6)}}

.body{position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:12px 14px 16px;display:flex;flex-direction:column;gap:14px;
  scrollbar-width:thin;scrollbar-color:var(--track) transparent;-webkit-overflow-scrolling:touch}
.page>*{animation:surf .32s var(--flow) both}
@keyframes surf{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page.leave{animation:sink .14s var(--soft) forwards}
@keyframes sink{to{opacity:0;transform:translateY(6px)}}

/* groups: a small label, then one card of rows */
.gh{display:flex;align-items:center;gap:6px;padding:0 4px 6px;font:600 10px Outfit;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);cursor:pointer}
.gh.static{cursor:default}
.gh .cnt{letter-spacing:.04em;text-transform:none;font-weight:500;color:var(--mute);opacity:0;transition:opacity .2s}
.gh .chev{margin-left:auto;width:14px;height:14px;color:var(--mute);transition:transform .22s var(--flow)}
.grp.col .gh .chev{transform:rotate(-90deg)}
.grp.col .gh .cnt{opacity:1}
.cwrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s var(--flow)}
.grp.col .cwrap{grid-template-rows:0fr}
.cwrap>.card{min-height:0}
.card{border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
:root[data-theme="pneuma"] .card{box-shadow:0 1px 2px var(--shadow)}

/* rows */
.it{position:relative;padding:9px 12px;min-height:44px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;overflow:hidden;transition:background .15s}
.card>*+*{border-top:1px solid var(--line)}
.it:hover{background:color-mix(in srgb,var(--aqua) 5%,transparent)}
.it:active:not(.noact){background:color-mix(in srgb,var(--aqua) 10%,transparent)}
.it .r{position:relative;z-index:1;display:flex;align-items:center;gap:10px}
.lbl{flex:1;min-width:0}
.lbl .n{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.lbl .d{display:block;font-size:11px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .tag{color:var(--gold)}
.it .v{font:500 12px Outfit;color:var(--aqua);cursor:text;padding:1px 4px;border-radius:5px;transition:background .15s;font-variant-numeric:tabular-nums}
.it .v:hover{background:var(--track)}
.vin{width:56px;background:var(--track);border:1px solid var(--aqua);border-radius:6px;padding:1px 6px;color:var(--text);font:500 12px Outfit;outline:0;text-align:right}
.peb{position:absolute;width:10px;height:10px;margin:-5px;border-radius:50%;background:color-mix(in srgb,var(--aqua) 22%,transparent);pointer-events:none;animation:peb .5s var(--flow) both}
@keyframes peb{0%{opacity:1;transform:scale(.2)}100%{opacity:0;transform:scale(26)}}

.star{flex:none;font-size:12px;line-height:1;color:var(--mute);opacity:0;transition:opacity .15s,transform .2s var(--pop),color .15s;cursor:pointer;padding:3px}
.it:hover .star{opacity:.5}
.it.fav .star{opacity:1;color:var(--gold)}
.it .star:hover{opacity:1;transform:scale(1.2)}
.star.burst{animation:starPop .35s var(--pop)}
@keyframes starPop{50%{transform:scale(1.6) rotate(25deg)}}

/* switch */
.sw{position:relative;width:36px;height:20px;border-radius:12px;background:var(--track);flex:none;overflow:hidden;transition:background .2s}
.sw i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--hydro);border-radius:12px;transition:width .24s var(--flow)}
.sw.on i{width:100%}
.sw b{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:9px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .28s var(--pop)}
.sw.on b{transform:translateX(16px)}
.sw.go b{animation:stretch .28s var(--flow)}
.sw.on.go b{animation-name:stretchR}
@keyframes stretch{40%{width:21px}}
@keyframes stretchR{40%{width:21px;margin-left:-5px}}

/* slider */
.sl{position:relative;z-index:1;height:14px;margin-top:8px;cursor:ew-resize;touch-action:none}
.sl .tr{position:absolute;left:0;right:0;top:5px;height:4px;border-radius:4px;background:var(--track)}
.sl .fl{position:absolute;left:0;top:5px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--hydro),var(--aqua))}
.sl .th{position:absolute;top:0;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4),0 0 0 3px color-mix(in srgb,var(--hydro) 35%,transparent);transition:transform .16s var(--pop)}
.sl:hover .th,.sl.drag .th{transform:scale(1.2)}

/* segmented single choice */
.seg{position:relative;display:flex;background:var(--track);border-radius:8px;padding:2px;flex:none}
.seg span{position:relative;z-index:1;padding:3px 11px;font-size:12px;color:var(--mute);cursor:pointer;transition:color .15s}
.seg span.on{color:#fff}
.seg em{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--hydro)}

/* multi choice */
.msum{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--aqua);max-width:55%}
.msum em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msum svg{flex:none;width:14px;height:14px;color:var(--mute);transition:transform .2s var(--flow)}
.multi.open .msum svg{transform:rotate(180deg)}
.mbox{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s var(--flow);position:relative;z-index:1}
.multi.open .mbox{grid-template-rows:1fr}
.mbox>div{overflow:hidden}
.mlist{display:flex;flex-wrap:wrap;gap:6px;padding-top:9px}
.mo{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 7px;border-radius:7px;background:var(--track);font-size:12px;color:var(--mute);cursor:pointer;transition:color .15s,background .15s,transform .12s}
.mo b{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:9px;color:transparent;transition:.15s}
.mo.on{color:var(--text);background:color-mix(in srgb,var(--hydro) 18%,transparent)}
.mo.on b{background:var(--hydro);border-color:var(--hydro);color:#fff}
.mo:active{transform:scale(.94)}

.accs{display:flex;gap:7px}
.accs i{width:18px;height:18px;border-radius:50%;background:var(--c);cursor:pointer;transition:transform .16s var(--pop),box-shadow .16s}
.accs i:hover{transform:scale(1.15)}
.accs i.on{box-shadow:0 0 0 2px var(--bg2),0 0 0 4px var(--c)}

.key{flex:none;min-width:34px;text-align:center;padding:3px 8px;border-radius:6px;font:500 11.5px Outfit;color:var(--text);background:var(--track);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);transition:transform .1s,color .2s}
.it:active .key{transform:translateY(1px)}
.key.listen{color:var(--aqua);animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 3px color-mix(in srgb,var(--aqua) 25%,transparent)}}

/* buttons: label in accent, arrow that turns into a check */
.it.btn .n{color:var(--aqua)}
.bi{position:relative;flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--aqua);overflow:hidden;transition:background .15s,color .15s,transform .2s var(--pop)}
.bi svg{position:absolute;width:14px;height:14px;transition:transform .22s var(--flow),opacity .15s}
.bi .ck{opacity:0;transform:scale(.4)}
.bi .ck path{stroke-dasharray:24;stroke-dashoffset:24}
.it.btn:hover .ar{transform:translateX(2px)}
.it.btn.done .bi{background:var(--hydro);color:#fff;transform:scale(1.05)}
.it.btn.done .ar{transform:translateX(22px);opacity:0}
.it.btn.done .ck{opacity:1;transform:none}
.it.btn.done .ck path{animation:draw .22s .04s var(--flow) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.it.danger .n,.it.danger .bi{color:#ff8f9c}
.it.danger.done .bi{background:#e0566a;color:#fff}
.it.danger.armed{background:rgba(255,110,130,.08);animation:shake .26s}
@keyframes shake{25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}}
.arm{position:absolute;left:0;bottom:0;height:2px;width:0;background:#ff8f9c;z-index:2}
.armed .arm{animation:drain 2.6s linear forwards}
@keyframes drain{from{width:100%}to{width:0}}

.in{flex:none;width:44%;background:var(--track);border:1px solid transparent;border-radius:7px;padding:5px 9px;color:var(--text);font:400 12.5px Outfit;outline:0;transition:border-color .15s}
.in:focus{border-color:var(--aqua)}
.note{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;font-size:11.5px;line-height:1.5;color:var(--mute)}
.note svg{flex:none;width:14px;height:14px;margin-top:2px;color:var(--gold)}
.sw2{flex:none;width:26px;height:16px;border-radius:5px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.pop{position:fixed;z-index:70;width:190px;padding:9px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);box-shadow:0 16px 40px -10px rgba(0,0,0,.6);animation:surf .2s var(--flow)}
.pop .svb{position:relative;height:100px;border-radius:7px;cursor:crosshair;touch-action:none;background:linear-gradient(0deg,#000,transparent),linear-gradient(90deg,#fff,hsl(var(--h),100%,50%))}
.pop .hue{position:relative;height:12px;margin-top:8px;border-radius:6px;cursor:ew-resize;touch-action:none;background:linear-gradient(90deg,red,#ff0,lime,cyan,blue,#f0f,red)}
.pop .k{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 3px #000;pointer-events:none}
.pop .hue .k{top:50%}
.pop .pre{display:flex;gap:5px;margin-top:8px}
.pop .pre i{flex:1;height:16px;border-radius:4px;cursor:pointer}

/* ---------------- home ---------------- */
.hero{display:flex;align-items:center;gap:12px;padding:12px}
.ava{position:relative;width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 16px Outfit;color:#fff;background:linear-gradient(135deg,var(--aqua),var(--hydro))}
.ava::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#4fd884;border:2px solid var(--bg2)}
.hero .who{flex:1;min-width:0}
.hero small{display:block;font-size:11px;color:var(--mute)}
.hero h3{font:600 15px Outfit;margin:1px 0}
.hero .gm{font-size:11.5px;color:var(--mute)}
.hero .gm b{color:var(--text);font-weight:500}
.hero .emb{width:30px;height:34px;opacity:.85}
.quote{display:flex;gap:8px;align-items:center;padding:9px 12px;font-size:11.5px;font-style:italic;color:var(--gold)}
.quote span{transition:opacity .25s}
.quote span.fade{opacity:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{position:relative;padding:10px 12px}
.stat+.stat{border-left:1px solid var(--line)}
.stat small{font-size:10.5px;color:var(--mute)}
.stat b{display:block;font:600 16px Outfit;margin-top:2px;font-variant-numeric:tabular-nums}
.stat b i{font-style:normal;font-size:11px;color:var(--mute);font-weight:400;margin-left:2px}
.stat .spark{position:absolute;right:10px;bottom:12px;width:38px;height:14px}

/* ======================= v9 motion layer (clean layout, lots of movement) ======================= */
/* 3D: the window sits on a tilting plane that follows the mouse and leans when flung */
.wob{perspective:1100px}
.tilt{transform-style:preserve-3d;will-change:transform}
.win{transform-origin:50% 100%;transform:translateY(40px) rotateX(42deg) scale(.9)}
.win.min{transform:translateY(30px) rotateX(-30deg) scale(.88)}
.glare{position:absolute;inset:0;pointer-events:none;z-index:6;border-radius:inherit;opacity:0;transition:opacity .35s;mix-blend-mode:screen;
  background:radial-gradient(320px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.09),transparent 60%)}
.win:hover .glare{opacity:1}
:root[data-theme="pneuma"] .glare{mix-blend-mode:normal;background:radial-gradient(320px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.45),transparent 60%)}

/* living background: slow aurora blobs and a few rising bubbles, parallax with the mouse */
.blobs{position:absolute;inset:-40px;pointer-events:none;transition:transform .6s var(--flow)}
.blob{position:absolute;border-radius:50%;filter:blur(42px);opacity:.32;animation:blob 16s ease-in-out infinite alternate}
.blob.b1{width:240px;height:200px;left:10%;top:-8%;background:var(--hydro)}
.blob.b2{width:180px;height:160px;right:2%;top:40%;background:var(--aqua);animation-duration:21s;animation-direction:alternate-reverse;opacity:.22}
.blob.b3{width:160px;height:140px;left:35%;bottom:-10%;background:var(--gold);animation-duration:25s;opacity:.12}
@keyframes blob{to{transform:translate(70px,40px) scale(1.25) rotate(25deg)}}
:root[data-theme="pneuma"] .blob{opacity:.18}
.bub{position:absolute;bottom:-14px;border-radius:50%;border:1px solid color-mix(in srgb,var(--aqua) 55%,transparent);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),transparent 60%);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:.8}50%{transform:translate(12px,-220px)}100%{transform:translate(-6px,-470px);opacity:0}}

/* logo flips like a coin now and then */
.logo{perspective:220px}
.logo svg{animation:coin 7s var(--flow) infinite}
@keyframes coin{0%,82%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}

/* title letters rise in one after another */
.act b span{display:inline-block;animation:let .5s var(--pop) both;animation-delay:calc(var(--k)*35ms);transform-origin:50% 100%}
@keyframes let{from{opacity:0;transform:translateY(10px) rotateX(85deg)}}
.act small{animation:surf .4s var(--flow) both}

/* rail: wiggle on hover, active icon floats, indicator glows */
.tab:hover svg{animation:wig .45s ease}
@keyframes wig{25%{rotate:-14deg}50%{rotate:10deg}75%{rotate:-4deg}}
.tab.on svg{animation:floaty 2.6s ease-in-out infinite}
.tab.on.jump svg{animation:tabJump .3s var(--pop),floaty 2.6s ease-in-out .3s infinite}
@keyframes floaty{50%{translate:0 -2px}}
.ind{box-shadow:0 0 18px -4px var(--hydro);animation:indGlow 2.6s ease-in-out infinite}
@keyframes indGlow{50%{box-shadow:0 0 22px -2px var(--hydro)}}

/* header icons are magnetic */
.ib{transition:background .15s,color .15s,transform .15s var(--pop),translate .25s var(--flow)}

/* pages: groups swing up in 3D, rows slide in one by one */
.page>*{animation:card3d .55s var(--pop) both;transform-origin:50% 0}
@keyframes card3d{from{opacity:0;transform:perspective(900px) rotateX(-32deg) translateY(18px) scale(.96)}}
.page .card>*{animation:row3d .45s var(--pop) both;animation-delay:calc(var(--d,0ms) + 90ms + var(--i,0)*38ms)}
@keyframes row3d{from{opacity:0;transform:translateX(-16px)}}
.page.quiet>*,.page.quiet .card>*{animation:none}
.page.leave{animation:leave3d .18s var(--soft) forwards}
@keyframes leave3d{to{opacity:0;transform:perspective(900px) rotateX(12deg) translateY(-8px) scale(.98)}}

/* rows: accent bar grows on hover, row nudges right */
.it{transition:background .15s,translate .25s var(--pop)}
.it::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--hydro);transform:scaleY(0);transition:transform .25s var(--pop);z-index:2}
.it:hover::before{transform:scaleY(1)}
.it:hover{translate:3px 0}
.it.noact:hover{translate:none}
.it:hover .sw{transform:scale(1.06)}
.sw{transition:background .2s,transform .2s var(--pop)}
.sw.on.go{animation:swPulse .55s ease-out}
@keyframes swPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hydro) 65%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.fxdot{position:fixed;left:0;top:0;width:5px;height:5px;margin:-2.5px;border-radius:50%;pointer-events:none;z-index:80}

/* slider value bubble pops above the thumb while dragging */
.sl .tipv{position:absolute;bottom:20px;transform:translateX(-50%) translateY(6px) scale(.3);opacity:0;padding:2px 8px;border-radius:8px;background:var(--hydro);color:#fff;
  font:600 11px Outfit;white-space:nowrap;transition:transform .22s var(--pop),opacity .15s;pointer-events:none;box-shadow:0 4px 12px -4px var(--hydro)}
.sl.drag .tipv{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.sl .fl{background:linear-gradient(90deg,var(--hydro),var(--aqua),var(--hydro));background-size:200% 100%;animation:flow 2.6s linear infinite}
@keyframes flow{to{background-position:-200% 0}}

/* button: icon spins into a check with a splash */
.it.btn.done .bi{animation:biPop .45s var(--pop)}
@keyframes biPop{40%{transform:scale(1.3) rotate(-12deg)}}

/* multi options pop in */
.multi.open .mo{animation:moIn .3s var(--pop) both}
.multi.open .mo:nth-child(2){animation-delay:.04s}.multi.open .mo:nth-child(3){animation-delay:.08s}.multi.open .mo:nth-child(4){animation-delay:.12s}
@keyframes moIn{from{opacity:0;transform:translateY(-6px) scale(.85)}}

/* toasts flip in */
.toast{animation:toast3d .45s var(--pop) both;transform-origin:50% 100%}
@keyframes toast3d{from{opacity:0;transform:perspective(600px) rotateX(-75deg) translateY(14px)}}

/* home: a real 3D hydro crystal with orbiting rings */
.gemBox{position:relative;width:64px;height:64px;flex:none;perspective:280px;display:grid;place-items:center;animation:gemFloat 3.4s ease-in-out infinite}
@keyframes gemFloat{50%{translate:0 -4px}}
.gem3d{position:relative;width:0;height:0;transform-style:preserve-3d;animation:gemSpin 6s linear infinite}
@keyframes gemSpin{from{transform:rotateX(-16deg) rotateY(0)}to{transform:rotateX(-16deg) rotateY(360deg)}}
.gem3d .f{position:absolute;width:26px;height:22.5px;left:-13px;opacity:.93}
.gem3d .f.t{top:-22.5px;transform-origin:50% 100%;clip-path:polygon(50% 0,100% 100%,0 100%)}
.gem3d .f.b{top:0;transform-origin:50% 0;clip-path:polygon(0 0,100% 0,50% 100%)}
.gr{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none}
.gr.g1{width:60px;height:60px;margin:-30px;border:1.5px solid var(--gold);animation:ring1 5s linear infinite;box-shadow:0 0 8px color-mix(in srgb,var(--gold) 50%,transparent)}
.gr.g2{width:48px;height:48px;margin:-24px;border:1.5px dashed var(--aqua);animation:ring2 7s linear infinite}
@keyframes ring1{from{transform:rotateX(74deg) rotateZ(0)}to{transform:rotateX(74deg) rotateZ(360deg)}}
@keyframes ring2{from{transform:rotateY(68deg) rotateZ(0)}to{transform:rotateY(68deg) rotateZ(-360deg)}}
.ava{animation:avaPulse 3s ease-in-out infinite}
@keyframes avaPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--hydro) 18%,transparent)}}
.stat b{transition:color .2s}
.onc{animation:moIn .3s var(--pop) both}
</style>
</head>

<script>
const $=s=>document.querySelector(s),win=$('#win'),fab=$('#fab'),wob=$('#wob');
const pick=a=>a[Math.random()*a.length|0];
const T0=Date.now();

/* ---------------- UI settings (saved in this browser) ---------------- */
const UI_DEF={scale:100,accent:'Hydro',glass:0,keyCode:'ShiftRight',keyLabel:'RShift',notify:true,sound:true,vol:60,calm:false,quotes:true};
let UI=Object.assign({},UI_DEF);try{Object.assign(UI,JSON.parse(localStorage.getItem('furinaUI')||'{}'))}catch{}
const saveUI=()=>{try{localStorage.setItem('furinaUI',JSON.stringify(UI))}catch{}};
const ACCENTS={Hydro:['#4aa3ff','#8fdcff','#2f7de1','#2f7de1'],Gold:['#d9a441','#f3d9a0','#a8781a','#a8781a'],Teal:['#22b3a3','#7fe8db','#0f8a7c','#0f8a7c'],
  Rose:['#e8679f','#ffb3d4','#c94681','#c94681'],Violet:['#7d6bff','#b9b0ff','#5b47e0','#5b47e0']};
const isLight=()=>document.documentElement.dataset.theme==='pneuma';
function applyUI(){const a=ACCENTS[UI.accent]||ACCENTS.Hydro,l=isLight(),st=document.documentElement.style;
  st.setProperty('--hydro',l?a[2]:a[0]);st.setProperty('--aqua',l?a[3]:a[1]);st.setProperty('--solid',1-UI.glass/100);saveUI()}

/* ---------------- sounds ---------------- */
let AC=null;
function tone(f1,f2,dur,type='sine',vol=.16,delay=0){if(!UI.sound||!UI.vol)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();

  if(it.t==='btn'){d=row(`<div class="r">${lbl(it)}<span class="bi">${ARROW}${CHECK}</span></div><span class="arm"></span>`,'btn'+(it.x?' danger':''));
    let armed=null,done=null;const nm=d.querySelector('.n');
    d.onclick=e=>{
      if(it.x&&!armed){armed=setTimeout(()=>{armed=null;d.classList.remove('armed');nm.textContent=it.n},2600);d.classList.add('armed');nm.textContent='Tap again to confirm';SFX.warn();return}
      if(armed){clearTimeout(armed);armed=null;d.classList.remove('armed');nm.textContent=it.n}
      pebble(e,d);clearTimeout(done);replay(d,'done');splash(d.querySelector('.bi'),it.x?['#ff8f9c','#ffffff']:['var(--gold)','var(--aqua)','#ffffff'],10);done=setTimeout(()=>d.classList.remove('done'),900);SFX.ok();
      if(it.cb)it.cb();else toast(it.n,'Done.')}}
  if(it.t==='inp'){d=row(`<div class="r">${lbl(it)}<input class="in" placeholder="${it.p}"></div>`,'noact');d.querySelector('input').onkeydown=e=>e.stopPropagation()}
  if(it.t==='col'){d=row(`<div class="r">${lbl(it)}<span class="sw2" style="--c:${it.v}"></span></div>`);d.onclick=e=>{e.stopPropagation();pebble(e,d);SFX.tick();openPicker(d,it)}}
  return d;
}
/* a label + one card of rows; the label folds the card */
function group(name,rows,{fold=true,key}={}){
  const g=document.createElement('section');g.className='grp';
  if(name){const h=document.createElement('div');h.className='gh'+(fold?'':' static');h.innerHTML=`<span>${name}</span><span class="cnt"></span>${fold?CHEV:''}`;g.appendChild(h);
    if(fold){const k=key||name;if(COLL.has(k))g.classList.add('col');h.querySelector('.cnt').textContent=`· ${rows.length}`;
      h.onclick=()=>{COLL.has(k)?COLL.delete(k):COLL.add(k);g.classList.toggle('col',COLL.has(k));SFX.tick()}}}
  const w=document.createElement('div');w.className='cwrap';const c=document.createElement('div');c.className='card';rows.forEach((r,ix)=>{r.style.setProperty('--i',Math.min(ix,10));c.appendChild(r)});w.appendChild(c);g.appendChild(w);return g}
function sections(list){const out=[];let name=null,rows=[];const flush=()=>{if(rows.length)out.push([name,rows]);rows=[]};
  list.forEach(it=>{if(it.t==='sec'){flush();name=it.n}else rows.push(build(it))});flush();return out}
function panic(){toggles().forEach(x=>x.v=false);say('Eek! Everything off!');toast('Panic','Every feature has been turned off.',2400,true);const c=cur;setTimeout(()=>{if(cur===c){cur=-1;openTab(c,'',false,true)}},300)}

/* color popover */
let pop=null;
function openPicker(d,it){
  if(pop){pop.remove();pop=null}
  let [h,s,v]=hsv(it.v);const r=d.getBoundingClientRect();
  pop=document.createElement('div');pop.className='pop';pop.style.left=Math.max(8,Math.min(innerWidth-200,r.right-190))+'px';pop.style.top=Math.min(innerHeight-175,r.bottom+4)+'px';
  pop.innerHTML=`<div class="svb"><div class="k"></div></div><div class="hue"><div class="k"></div></div><div class="pre">${['#4aa3ff','#8fdcff','#d8b878','#ffffff','#ff4f6d','#5aff78'].map(c=>`<i style="background:${c}" data-c="${c}"></i>`).join('')}</div>`;
  document.body.appendChild(pop);pop.onclick=e=>e.stopPropagation();
  const sv=pop.querySelector('.svb'),hu=pop.querySelector('.hue');
  const paint=()=>{it.v=hex(h,s,v);sv.style.setProperty('--h',h);sv.firstChild.style.cssText=`left:${s*100}%;top:${(1-v)*100}%;background:${it.v}`;
    hu.firstChild.style.left=(h/3.6)+'%';d.querySelector('.sw2').style.setProperty('--c',it.v)};
  const drag=(el,fn)=>{el.onpointerdown=e=>{try{el.setPointerCapture(e.pointerId)}catch{}fn(e);el.onpointermove=fn};el.onpointerup=el.onpointercancel=()=>el.onpointermove=null};
  const c01=x=>Math.min(1,Math.max(0,x));
  drag(sv,e=>{const b=sv.getBoundingClientRect();s=c01((e.clientX-b.left)/b.width);v=1-c01((e.clientY-b.top)/b.height);paint()});
  drag(hu,e=>{const b=hu.getBoundingClientRect();h=c01((e.clientX-b.left)/b.width)*360;paint()});
  pop.querySelectorAll('.pre i').forEach(i=>i.onclick=()=>{[h,s,v]=hsv(i.dataset.c);paint();SFX.tick()});paint();
}
addEventListener('click',()=>{if(pop){pop.remove();pop=null}});
function hsv(hx){const n=parseInt(hx.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);
  let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
function hex(h,s,v){const f=n=>{const k=(n+h/60)%6;return Math.round((v-v*s*Math.max(0,Math.min(k,4-k,1)))*255)};return'#'+[f(5),f(3),f(1)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------------- home ---------------- */
let frames=0,fps=60,fpsHist=[],quoteI=0;
function homeEls(){
  const hero=document.createElement('div');hero.className='hero';
  hero.innerHTML=`<div class="ava">P</div><div class="who"><small>Welcome back</small><h3>Player</h3><div class="gm">Silent Assassins · server <b>#3F2A</b></div></div><div class="gemBox"><div class="gem3d"></div><i class="gr g1"></i><i class="gr g2"></i></div>`;makeGem(hero.querySelector('.gem3d'));
  const q=document.createElement('div');q.className='quote';q.innerHTML=`<span id="hQuote">“${QUOTES[quoteI%QUOTES.length]}”</span>`;
  const st=document.createElement('div');st.className='stats';
  st.innerHTML=`<div class="stat"><small>FPS</small><b id="hFps">0</b><svg class="spark" viewBox="0 0 38 14"><polyline id="hSpark" fill="none" stroke="var(--aqua)" stroke-width="1.5" stroke-linejoin="round" points=""/></svg></div>
    <div class="stat"><small>Ping <span class="dot" id="hDot"></span></small><b id="hPing">48<i>ms</i></b></div>
    <div class="stat"><small>Players</small><b id="hPl">0</b></div>
    <div class="stat"><small>Session</small><b id="hSess">00:00</b></div>`;
  const favs=toggles().filter(x=>x.fav).map(build);
  if(!favs.length){const e=document.createElement('div');e.className='empty';e.textContent='Tap the ★ on any switch to pin it here.';favs.push(e)}
  const ol=document.createElement('div');ol.className='onlist';ol.id='hOn';
  return[group(null,[hero,q]),group(null,[st]),group('Quick toggles',favs,{fold:false}),group('On right now',[ol],{fold:false})];
}
function refreshOnList(){const ol=document.querySelector('.page:not(.leave) #hOn');if(!ol)return;
  const on=toggles().filter(x=>x.v),MAX=8;
  ol.innerHTML=on.length?'':'<span class="empty" style="padding:2px 0">Nothing on. A quiet night at the opera.</span>';
  on.slice(0,MAX).forEach(x=>{const c=document.createElement('span');c.className='onc';c.title='Turn off';c.innerHTML=`${x.n}<i>✕</i>`;
    c.onclick=()=>{setTog(x,false);refreshOnList();document.querySelectorAll('.page:not(.leave) .it').forEach(t=>{if(t.querySelector('.n')?.textContent===x.n)t.querySelector('.sw')?.classList.remove('on')})};ol.appendChild(c)});
  if(on.length>MAX){const m=document.createElement('span');m.className='onc more';m.textContent=`+${on.length-MAX} more`;ol.appendChild(m)}}
function refreshHome(){if(cur!==HOME)return;cur=-1;openTab(HOME,'',false,true)}
function tickHome(){if(cur!==HOME)return;const p=document.querySelector('.page:not(.leave)');const f=p&&p.querySelector('#hFps');if(!f)return;countTo(f,fps);
  const ping=36+Math.round(Math.random()*28);countTo(p.querySelector('#hPing'),ping,'<i>ms</i>');p.querySelector('#hDot').style.background=ping<60?'#4fd884':'#ffc65c';
  const sec=Math.floor((Date.now()-T0)/1000);p.querySelector('#hSess').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
  const mx=Math.max(70,...fpsHist);p.querySelector('#hSpark').setAttribute('points',fpsHist.map((v,i)=>`${(i/Math.max(1,fpsHist.length-1))*38},${13-v/mx*12}`).join(' '))}
setInterval(()=>{fps=frames;frames=0;fpsHist.push(fps);if(fpsHist.length>16)fpsHist.shift();tickHome()},1000);
setInterval(()=>{if(cur!==HOME)return;const q=document.querySelector('.page:not(.leave) #hQuote');if(!q)return;q.classList.add('fade');
  setTimeout(()=>{quoteI++;q.textContent=`“${QUOTES[quoteI%QUOTES.length]}”`;q.classList.remove('fade')},260)},6000);

/* ---------------- tabs ---------------- */
const tabsEl=$('#tabs'),body=$('#body'),ind=$('#ind');let cur=-1,page=null,indPos=null,indInit=false;
const COLL=new Set();
TABS.forEach(([n,ic],i)=>{const t=document.createElement('div');t.className='tab'+(i===SETTINGS?' sep':'');t.innerHTML=svg(ic)+`<span class="tip">${n}</span>`;
  t.onpointerdown=()=>{replay(t,'jump');if(i!==cur)SFX.tab();openTab(i)};tabsEl.appendChild(t)});
function moveInd(i,instant){const t=tabsEl.querySelectorAll('.tab')[i],a=t.offsetTop,total=tabsEl.clientHeight;
  if(!indInit||instant){ind.style.transition='none';indInit=true}
  else{const f='.15s cubic-bezier(.5,0,.2,1)',s='.3s cubic-bezier(.5,0,.2,1) .03s';ind.style.transition=a>indPos?`bottom ${f},top ${s}`:`top ${f},bottom ${s}`}
  ind.style.top=a+'px';ind.style.bottom=(total-a-t.offsetHeight)+'px';indPos=a}
function openTab(i,q='',again=false,quiet=false){
  const changed=i!==cur;cur=i;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on',j===i));moveInd(i);
  if(changed){const an=$('#actNo');an.textContent=q?'SEARCH':actLabel(i);replay(an,'x');setTitle(TABS[i][0])}
  if(page){const o=page;if(changed&&!quiet){o.classList.add('leave');setTimeout(()=>o.remove(),150)}else o.remove()}
  const p=document.createElement('div');p.className='page'+(quiet?' quiet':'');
  let els;
  if(q){const hits=[];TABS.forEach(([tn,,list])=>{if(!Array.isArray(list))return;list.forEach(x=>{if(x.n&&x.t!=='sec'&&x.t!=='note'&&x.n.toLowerCase().includes(q)){TAG=tn;hits.push(build(x));TAG=''}})});
    els=hits.length?[group(`${hits.length} result${hits.length>1?'s':''}`,hits,{fold:false})]:[Object.assign(document.createElement('div'),{className:'empty',textContent:'Nothing on stage by that name.'})]}
  else if(i===HOME)els=homeEls();
  else{if(i===SETTINGS)syncSettings();els=sections(TABS[i][2]).map(([n,rows])=>group(n,rows,{key:i+':'+n}))}
  els.forEach((el,k)=>{const dl=quiet?0:(changed?60:again?200:0)+k*80;el.style.animationDelay=dl+'ms';el.style.setProperty('--d',dl+'ms');p.appendChild(el)});
  body.appendChild(p);page=p;
  if(i===HOME&&!q){refreshOnList();tickHome();countTo(p.querySelector('#hPl'),11,'<i>/ 16</i>')}
}
$('#sbox').querySelector('svg').onclick=()=>{$('#sbox').classList.toggle('open');$('#q').focus();SFX.tick()};
$('#q').oninput=e=>{const q=e.target.value.trim().toLowerCase();openTab(cur,q);$('#actNo').textContent=q?'SEARCH':actLabel(cur)};
$('#q').onkeydown=e=>{e.stopPropagation();if(e.key==='Escape'){e.target.value='';e.target.dispatchEvent(new Event('input'));$('#sbox').classList.remove('open');e.target.blur()}};

/* ---------------- drag ---------------- */
let FK=1,tx=0,ty=0,x=0,y=0,vx=0,vy=0,dr=null,last=0,peak=0,lastSay=-1e9;const head=$('#head');
let mRX=0,mRY=0,rx=0,ry=0,freeze=false;const tiltEl=$('#tilt');
function drip(px,py,dvx,dvy){const d=document.createElement('div');d.className='drip';$('#drips').appendChild(d);const floor=innerHeight-6;let n=0;
  (function f(){dvy+=.45;px+=dvx;py+=dvy;n++;d.style.transform=`translate(${px}px,${py}px)`;
    if(py>=floor||n>140){d.remove();if(py>=floor){const s=document.createElement('div');s.className='splat';s.style.left=px+'px';s.style.top=floor+'px';$('#drips').appendChild(s);setTimeout(()=>s.remove(),500)}return}
    requestAnimationFrame(f)})()}
head.onpointerdown=e=>{if(e.target.closest('input,.ib,.sbox'))return;dr={sx:e.clientX-tx,sy:e.clientY-ty};peak=0;try{head.setPointerCapture(e.pointerId)}catch{}};
head.onpointermove=e=>{if(dr){tx=e.clientX-dr.sx;ty=e.clientY-dr.sy}};
head.onpointerup=head.onpointercancel=()=>{if(!dr)return;dr=null;if(UI.calm)return;
  if(peak>12)replay(wob,'boing');
  if(peak>20&&performance.now()-lastSay>9000){lastSay=performance.now();say(pick(LAND))}};
wob.addEventListener('animationend',e=>{if(e.target===wob)wob.classList.remove('boing')});
(function loop(t){frames++;
  if(UI.calm){x+=(tx-x)*.3;y+=(ty-y)*.3;vx=vy=0}else{vx+=(tx-x)*.14;vy+=(ty-y)*.14;vx*=.74;vy*=.74;x+=vx;y+=vy}
  wob.style.translate=`${x/FK}px ${y/FK}px`;
  const sp=Math.hypot(vx,vy);peak=Math.max(peak,sp);
  if(!wob.classList.contains('boing')){const st=Math.min(.025,sp*.002);wob.style.transform=UI.calm?'':`scale(${1+st},${1-st})`}
  if(!freeze){const c=UI.calm?0:1,trx=Math.max(-14,Math.min(14,(mRX-vy*.7)*c)),tryy=Math.max(-14,Math.min(14,(mRY+vx*.7)*c));
    rx+=(trx-rx)*.12;ry+=(tryy-ry)*.12;tiltEl.style.transform=`rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`}
  if(!UI.calm&&dr&&sp>18&&t-last>120){last=t;const r=win.getBoundingClientRect();drip(r.left+20+Math.random()*(r.width-40),r.bottom-4,-vx*.2,-vy*.15-1)}
  requestAnimationFrame(loop)})(0);

win.addEventListener('mousemove',e=>{const r=win.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  mRX=-(py-.5)*7;mRY=(px-.5)*9;const g=$('#glare');g.style.setProperty('--gx',px*100+'%');g.style.setProperty('--gy',py*100+'%');
  if(!UI.calm)$('#blobs').style.transform=`translate(${-(px-.5)*26}px,${-(py-.5)*18}px)`});
win.addEventListener('mouseleave',()=>{mRX=mRY=0;$('#blobs').style.transform=''});

/* ---------------- desktop / phone ---------------- */
let forced=null;
function layout(keepPos){
  const real=innerWidth<640||innerHeight<430,phone=forced??real,sim=phone&&!real,sc=UI.scale/100;
  document.body.classList.toggle('phone',phone);document.body.classList.toggle('sim',sim);
  const dev=$('#device');[$('#toasts'),fab].forEach(el=>{const want=sim?dev:document.body;if(el.parentNode!==want)want.appendChild(el)});
  const H=innerHeight-58,base=sim?Math.min(1.2,(innerWidth-24)/866,H/412):phone?Math.min(1.3,(innerWidth-12)/524,H/340):Math.min(1.25,(innerWidth-24)/544,H/404);
  FK=Math.max(.3,sim?base:base*sc);
  $('#fit').style.transform=`scale(${FK})`;wob.style.scale=sim&&sc!==1?sc:'';
  $('#phoneBtn').textContent=phone?'🖥 Desktop view':'📱 Phone view';
  if(!keepPos)tx=ty=x=y=vx=vy=0;if(cur>=0)moveInd(cur,true);
}
$('#phoneBtn').onclick=()=>{forced=!document.body.classList.contains('phone');if(forced===(innerWidth<640||innerHeight<430))forced=null;layout()};
addEventListener('resize',()=>layout(true));

/* ---------------- theme ---------------- */
function setTheme(light){
  if(light===isLight()){byId('theme').v=light?'Pneuma':'Ousia';return}
  const apply=()=>{if(light)document.documentElement.dataset.theme='pneuma';else delete document.documentElement.dataset.theme;byId('theme').v=light?'Pneuma':'Ousia';applyUI()};
  const inner=$('#inner'),m=$('#mode').getBoundingClientRect(),[cx,cy]=local({clientX:m.left+m.width/2,clientY:m.top+m.height/2},inner),
        R=Math.hypot(inner.offsetWidth,inner.offsetHeight),w=document.createElement('div');
  w.style.cssText=`position:absolute;inset:0;z-index:20;pointer-events:none;background:${light?'#f8fafe':'#0f1c3d'}`;
  inner.appendChild(w);SFX.pop();replay($('#mode'),'spin');
  for(let k=0;k<3;k++){const rg=document.createElement('i');rg.style.cssText=`position:absolute;left:${cx}px;top:${cy}px;width:20px;height:20px;margin:-10px;border-radius:50%;border:1.5px solid ${light?'#2f7de1':'#8fdcff'};z-index:21;pointer-events:none`;
    inner.appendChild(rg);rg.animate([{transform:'scale(.3)',opacity:.9},{transform:'scale(28)',opacity:0}],{duration:700,delay:k*110,easing:'cubic-bezier(.2,.8,.3,1)',fill:'both'});setTimeout(()=>rg.remove(),1100)}
  w.animate([{clipPath:`circle(0px at ${cx}px ${cy}px)`},{clipPath:`circle(${R}px at ${cx}px ${cy}px)`}],{duration:380,easing:'cubic-bezier(.45,0,.2,1)',fill:'forwards'});
  setTimeout(()=>{apply();w.animate([{opacity:1},{opacity:0}],{duration:200,fill:'forwards'});setTimeout(()=>w.remove(),220);
    if(cur===SETTINGS){const c=cur;cur=-1;openTab(c,'',false,true)}},380);
}
$('#mode').onclick=()=>setTheme(!isLight());

/* ---------------- show / hide ---------------- */
let shown=false;
function showWin(v,quiet){shown=v;win.classList.remove('min');win.classList.toggle('open',v);fab.classList.toggle('show',!v&&!quiet);if(v){if(!quiet)SFX.open();const c=cur;cur=-1;openTab(c<0?HOME:c,'',true)}}
$('#minB').onclick=()=>{shown=false;win.classList.add('min');win.classList.remove('open');fab.classList.add('show');SFX.close()};
$('#xB').onclick=()=>{$('#minB').onclick();toast('Furina Hub',`Hidden. Press ${UI.keyLabel} or tap the drop.`)};
fab.onclick=()=>showWin(true);
$('#railLogo').onclick=()=>{SFX.pop();say(pick(QUOTES),2200)};
addEventListener('keydown',e=>{if(e.code===UI.keyCode&&!(e.target instanceof HTMLInputElement)){e.preventDefault();shown?$('#minB').onclick():showWin(true)}});

function intro(){
  const old=$('#intro'),it=old.cloneNode(true);old.replaceWith(it);it.style.display='';
  win.classList.remove('open','min','fast');fab.classList.remove('show');shown=false;
  setTimeout(()=>{it.classList.add('done');showWin(true,true)},2300);
  setTimeout(()=>{it.style.display='none';win.classList.add('fast');say('Welcome back~',1800)},3100);
}
$('#replay').onclick=intro;
applyUI();layout();intro();
</script>
